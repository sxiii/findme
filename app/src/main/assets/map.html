<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; width: 100%; background-color: #1a1a1a; }
        #map { position: absolute; top: 0; bottom: 0; left: 0; right: 0; background-color: #1a1a1a; }
        .leaflet-container { background-color: #1a1a1a; width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        var map = null;
        var marker = null;
        var circle = null;

        function initMap(lat, lon, isDark) {
            try {
                const bgColor = isDark ? "#1a1a1a" : "#ffffff";
                document.body.style.backgroundColor = bgColor;
                document.getElementById('map').style.backgroundColor = bgColor;

                if (!map) {
                    map = L.map('map').setView([lat, lon], 15);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '&copy; OpenStreetMap contributors',
                        maxZoom: 19
                    }).addTo(map);

                    marker = L.marker([lat, lon]).addTo(map).bindPopup('Location: ' + lat + ', ' + lon);
                    circle = L.circleMarker([lat, lon], {
                        radius: 100,
                        fillColor: '#0066ff',
                        color: '#0066ff',
                        weight: 2,
                        opacity: 0.3,
                        fillOpacity: 0.1
                    }).addTo(map);
                } else {
                    map.setView([lat, lon], 15);
                    marker.setLatLng([lat, lon]).setPopupContent('Location: ' + lat + ', ' + lon);
                    circle.setLatLng([lat, lon]);
                }

                setTimeout(function() {
                    map.invalidateSize();
                }, 100);
            } catch (e) {
                console.error("MapInit Error: " + e.message);
            }
        }
    </script>
</body>
</html>
