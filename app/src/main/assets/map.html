<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="color-scheme" content="dark">
    <title>Findme Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        :root {
            color-scheme: dark;
            --surface: #171b22;
            --text: #f1f5f9;
            --muted: #aab4c2;
            --accent: #72e0c1;
        }

        * { box-sizing: border-box; }

        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #111820;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .map-status {
            position: absolute;
            z-index: 1000;
            left: 12px;
            right: 68px;
            bottom: 16px;
            width: fit-content;
            max-width: calc(100% - 92px);
            padding: 9px 13px;
            border: 1px solid rgba(255, 255, 255, .09);
            border-radius: 14px;
            background: rgba(23, 27, 34, .94);
            color: var(--text);
            font-size: 13px;
            line-height: 1.35;
            box-shadow: 0 4px 18px rgba(0, 0, 0, .32);
            pointer-events: none;
        }

        .map-status small {
            display: block;
            margin-top: 2px;
            color: var(--muted);
            font-size: 11px;
        }

        .locate-button {
            position: absolute;
            z-index: 1000;
            right: 14px;
            bottom: 16px;
            width: 44px;
            height: 44px;
            padding: 0;
            border: 1px solid rgba(255, 255, 255, .12);
            border-radius: 14px;
            background: var(--surface);
            color: var(--accent);
            font-size: 23px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, .35);
            cursor: pointer;
        }

        .locate-button:active { transform: scale(.96); }

        .user-marker {
            width: 20px;
            height: 20px;
            border: 3px solid #fff;
            border-radius: 50%;
            background: #58d6b2;
            box-shadow: 0 0 0 6px rgba(88, 214, 178, .24), 0 2px 8px rgba(0, 0, 0, .5);
        }

        .leaflet-control-zoom a {
            background: #171b22 !important;
            color: #f1f5f9 !important;
            border-color: rgba(255, 255, 255, .12) !important;
        }

        .leaflet-control-attribution {
            background: rgba(23, 27, 34, .8) !important;
            color: #c3ccd7 !important;
        }

        .leaflet-control-attribution a { color: #72e0c1 !important; }
        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            background: #202630;
            color: #f1f5f9;
        }
    </style>
</head>
<body>
<div id="map" aria-label="Dark themed location map"></div>
<div id="status" class="map-status">Finding your location<small>Waiting for a location update</small></div>
<button id="locate" class="locate-button" type="button" aria-label="Center map on my location" title="My location">◎</button>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
    const map = L.map('map', {
        zoomControl: false,
        preferCanvas: true
    }).setView([20, 0], 2);

    L.control.zoom({ position: 'topright' }).addTo(map);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
        subdomains: 'abcd',
        maxZoom: 20
    }).addTo(map);

    const userIcon = L.divIcon({
        className: '',
        html: '<div class="user-marker"></div>',
        iconSize: [20, 20],
        iconAnchor: [10, 10]
    });
    let marker = null;
    let accuracyCircle = null;
    let hasLocation = false;
    const status = document.getElementById('status');

    function showStatus(title, detail) {
        status.innerHTML = '';
        status.appendChild(document.createTextNode(title));
        const small = document.createElement('small');
        small.textContent = detail;
        status.appendChild(small);
    }

    // Public entry points for a native Android WebView to send location updates.
    window.setUserLocation = function (latitude, longitude, accuracy, follow) {
        const lat = Number(latitude);
        const lon = Number(longitude);
        const radius = Number(accuracy) || 0;
        if (!Number.isFinite(lat) || !Number.isFinite(lon) || Math.abs(lat) > 90 || Math.abs(lon) > 180) return;

        const point = [lat, lon];
        if (!marker) {
            marker = L.marker(point, { icon: userIcon, keyboard: false }).addTo(map);
        } else {
            marker.setLatLng(point);
        }
        if (accuracyCircle) map.removeLayer(accuracyCircle);
        if (radius > 0) {
            accuracyCircle = L.circle(point, {
                radius: radius,
                color: '#58d6b2',
                weight: 1,
                opacity: .75,
                fillColor: '#58d6b2',
                fillOpacity: .12
            }).addTo(map);
        }
        hasLocation = true;
        showStatus('Your location', radius > 0 ? 'Accuracy about ' + Math.round(radius) + ' m' : 'Location updated');
        if (follow === true || !hasLocationBeforeUpdate) map.setView(point, Math.max(map.getZoom(), 15), { animate: true });
        hasLocationBeforeUpdate = true;
    };
    window.updateLocation = window.setUserLocation;
    window.updateUserLocation = window.setUserLocation;
    let hasLocationBeforeUpdate = false;

    function centerOnLocation() {
        if (hasLocation && marker) {
            map.setView(marker.getLatLng(), Math.max(map.getZoom(), 15), { animate: true });
        } else if (navigator.geolocation) {
            showStatus('Finding your location', 'Waiting for a location update');
            navigator.geolocation.getCurrentPosition(function (position) {
                window.setUserLocation(position.coords.latitude, position.coords.longitude, position.coords.accuracy, true);
            }, function () {
                showStatus('Location unavailable', 'Allow location access to show your position');
            }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 10000 });
        } else {
            showStatus('Location unavailable', 'This device does not provide location access');
        }
    }

    document.getElementById('locate').addEventListener('click', centerOnLocation);

    if (navigator.geolocation) {
        navigator.geolocation.watchPosition(function (position) {
            window.setUserLocation(position.coords.latitude, position.coords.longitude, position.coords.accuracy, false);
        }, function () {
            if (!hasLocation) showStatus('Map ready', 'Location access is unavailable');
        }, { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 });
    } else {
        showStatus('Map ready', 'Location access is unavailable');
    }
})();
</script>
</body>
</html>
